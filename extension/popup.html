<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>도우미누오 · 환경설정</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <header class="popup-head">
      <h1 class="popup-title">환경설정</h1>
      <a id="popupVersion"
         class="popup-version"
         href="https://github.com/HyunbinPark2359/douminuo/blob/main/CHANGELOG.md"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="변경 내역을 새 탭에서 엽니다"></a>
    </header>

    <section id="panelSettings" role="region" aria-label="환경설정">

      <section class="options-section" aria-labelledby="copy-heading">
        <h3 id="copy-heading" class="options-heading">샘플 복사</h3>
        <p class="sub options-desc">파티 페이지 복사 아이콘에 담을 항목입니다.</p>
        <div class="settings-options-row" role="group" aria-labelledby="copy-heading">
          <label class="settings-option-row" for="optUrls"><input type="checkbox" id="optUrls" /><span>URL</span></label>
          <label class="settings-option-row" for="optReal"><input type="checkbox" id="optReal" /><span>실수치</span></label>
          <label class="settings-option-row" for="optPow"><input type="checkbox" id="optPow" /><span>결정력</span></label>
          <label class="settings-option-row" for="optBulk"><input type="checkbox" id="optBulk" /><span>내구력</span></label>
          <label class="settings-option-row" for="optSd"><input type="checkbox" id="optSd" /><span>Showdown</span></label>
        </div>
      </section>

      <section class="options-section" aria-labelledby="entry-heading">
        <h3 id="entry-heading" class="options-heading">바로가기</h3>
        <p class="sub options-desc">스마트누오 화면에 도우미 기능을 표시합니다.</p>
        <div class="settings-options-row" role="group" aria-labelledby="entry-heading">
          <label class="settings-option-row" for="showCalcFloating"><input type="checkbox" id="showCalcFloating" /><span>계산기 · 스피드 내 파티</span></label>
          <label class="settings-option-row" for="showTeamBuilderFloating"><input type="checkbox" id="showTeamBuilderFloating" /><span>파티 복사 아이콘</span></label>
        </div>
      </section>

      <section class="options-section" aria-labelledby="tb-inline-heading">
        <div class="settings-heading-row">
          <h3 id="tb-inline-heading" class="options-heading">파티 결정력·내구력</h3>
          <label class="toggle-switch" title="켜기/끄기">
            <input type="checkbox" id="tbInlineEnabled" aria-labelledby="tb-inline-heading" />
            <span class="toggle-switch-track" aria-hidden="true"></span>
          </label>
        </div>
        <p class="sub options-desc">파티 리스트 카드에 결정력과 내구력을 표시합니다.</p>
      </section>

      <section class="options-section" aria-labelledby="simple-speed-heading">
        <div class="settings-heading-row">
          <h3 id="simple-speed-heading" class="options-heading">간단 스피드 계산기</h3>
          <label class="toggle-switch" title="켜기/끄기">
            <input type="checkbox" id="simpleSpeedCalcEnabled" aria-labelledby="simple-speed-heading" />
            <span class="toggle-switch-track" aria-hidden="true"></span>
          </label>
        </div>
        <p class="sub options-desc">스피드 실수값 옆에 추월 가능한 종족값을 표시합니다.</p>
      </section>

      <section class="options-section" aria-labelledby="update-notice-heading">
        <div class="settings-heading-row">
          <h3 id="update-notice-heading" class="options-heading">업데이트 알림</h3>
          <label class="toggle-switch" title="켜기/끄기">
            <input type="checkbox" id="updateNoticeEnabled" aria-labelledby="update-notice-heading" />
            <span class="toggle-switch-track" aria-hidden="true"></span>
          </label>
        </div>
        <p class="sub options-desc">업데이트되면 스마트누오 페이지에 알림을 표시합니다.</p>
      </section>

    </section>

    <footer class="popup-foot">
      <a class="popup-foot__link"
         href="https://docs.google.com/forms/d/e/1FAIpQLSfA97NKxUqModwfLulTKqiBrSmnYvwPUEaMXa1__-lP5orG1Q/viewform?usp=header"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="문의·제보 폼을 새 탭에서 엽니다">
        <svg class="popup-foot__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M16.881 4.346A23.112 23.112 0 0 1 8.25 6H7.5a5.25 5.25 0 0 0-.88 10.428 21.74 21.74 0 0 0 1.728 4.93c.42.838 1.41 1.21 2.32.94l.78-.236c.94-.281 1.456-1.282 1.151-2.214a17.836 17.836 0 0 0-1.1-2.69 23.115 23.115 0 0 1 5.382 1.345 23.247 23.247 0 0 0 0-14.157Z M19.5 6a3 3 0 0 1 0 6V6Z"/>
        </svg>
        <span class="popup-foot__text">문의·제보</span>
      </a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
